<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>Prospects | Trindade Ruddy</title>
<style>
:root{--ink:#17211e;--muted:#68746e;--line:#e0e7e2;--paper:#f5f7f4;--white:#fff;--green:#176b50;--deep:#123e31;--mint:#e5f2eb;--gold:#d6a758;--red:#a43c37;--shadow:0 16px 50px #18372b0d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:28px 28px 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:44px}.brand{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:750;letter-spacing:.04em}.mark{width:38px;height:38px;border-radius:12px;background:var(--deep);color:#fff;display:grid;place-items:center;font:italic 20px Georgia}.private{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#4c9b70}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:var(--green);font-size:11px;font-weight:800;margin-bottom:8px}.hero h1{font:500 clamp(32px,4vw,46px)/1.12 Georgia,serif;margin:0 0 10px}.hero p{color:var(--muted);margin:0}.primary,.secondary,.iconbtn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary{background:var(--deep);color:#fff}.primary:hover{background:#1b5744}.secondary{background:#edf2ee;color:var(--deep)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 24px}.stat,.panel{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px 20px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font:28px Georgia,serif;margin-top:5px}.toolbar{display:flex;gap:12px;margin-bottom:16px}.search{flex:1;max-width:420px}.control{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 12px;color:var(--ink);outline:none}.control:focus{border-color:#6b9a82;box-shadow:0 0 0 3px #176b5015}.tablewrap{overflow:auto}.panel{overflow:hidden}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{text-align:left;background:#fafbf9;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:14px 18px}.table td{padding:15px 18px;border-top:1px solid #edf0ed;vertical-align:middle}.company{font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-flex;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;background:#eef1ef;color:#58645d}.b-novo{background:#eaf1fd;color:#3d639c}.b-contato{background:#fff3da;color:#94651c}.b-proposta{background:#eee9fa;color:#6f56a2}.b-cliente{background:#e3f3e9;color:#31764e}.b-pausado{background:#f4e9e8;color:#99504b}.actions{display:flex;gap:6px}.iconbtn{padding:7px 9px;background:transparent;color:var(--muted)}.iconbtn:hover{background:#edf2ee;color:var(--deep)}.empty{text-align:center;padding:56px 20px;color:var(--muted)}.empty strong{display:block;font:23px Georgia,serif;color:var(--ink);margin-bottom:8px}.footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;color:var(--muted);font-size:12px}.foot-actions{display:flex;gap:8px}.overlay{position:fixed;inset:0;background:#10201899;display:grid;place-items:center;padding:20px;z-index:5}.dialog{background:#fff;border-radius:18px;padding:28px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 100px #0003}.dialog h2{font:28px Georgia,serif;margin:0 0 6px}.dialog p{color:var(--muted);margin:0 0 22px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#46544c}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:88px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:var(--shadow)}.authbox .mark{margin-bottom:24px}.authbox h1{font:32px Georgia,serif;margin:0 0 8px}.authbox p{color:var(--muted);font-size:13px;margin:0 0 22px}.authbox .field{margin:16px 0}.authbox button{width:100%;margin-top:4px}.hint{font-size:11px;color:var(--muted);margin-top:16px}.error{color:var(--red);font-size:12px;margin-top:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 16px;border-radius:10px;z-index:9}.hidden{display:none!important}@media(max-width:700px){.shell{padding:20px 16px 36px}.top{margin-bottom:34px}.hero{align-items:start;flex-direction:column}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:24px}.toolbar{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}.footer{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.dialog{padding:22px}.private{font-size:0}.private .dot{font-size:12px}}
/* Paleta azul e preto escuro alinhada ao site oficial */
:root{--ink:#101522;--muted:#687386;--line:#dce2eb;--paper:#f4f6fa;--green:#2868d7;--deep:#111827;--mint:#e5edfc;--blue:#2868d7;--shadow:0 16px 50px #1118270d}
.mark{background:#111827}.dot{background:#2868d7}.eyebrow{color:#2868d7}.primary{background:#2868d7}.primary:hover{background:#1f55b5}.secondary{background:#e8edf5;color:#111827}.control:focus{border-color:#6f96df;box-shadow:0 0 0 3px #2868d715}.iconbtn:hover{background:#e8edf5;color:#2868d7}.b-cliente{background:#e5edfc;color:#2859a8}.footer{color:#687386}
</style></head>
<body><main id="app"></main><input id="fileInput" type="file" accept="application/json" class="hidden">
<script>
(()=>{'use strict';
const KEY='trindade-ruddy-prospects-v1',app=document.getElementById('app'),fileInput=document.getElementById('fileInput');let key=null,records=[],query='',filter='Todos';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));const un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(data,k=key){const iv=crypto.getRandomValues(new Uint8Array(12)),bytes=new TextEncoder().encode(JSON.stringify(data)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,bytes);return {version:1,iv:b64(iv),cipher:b64(cipher)}}
async function persist(){localStorage.setItem(KEY,JSON.stringify({salt:localStorage.getItem(KEY)?JSON.parse(localStorage.getItem(KEY)).salt:null,...await seal(records)}))}
function toast(s){let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2400)}
function setup(){app.innerHTML=`<div class="auth"><section class="authbox"><div class="mark">T</div><div class="eyebrow">Área privada</div><h1>Caderno de prospects</h1><p>Crie uma senha para proteger seus dados. Ela não pode ser recuperada; guarde-a com segurança.</p><form id="setup"><div class="field"><label for="pass">Criar senha</label><input class="control" id="pass" type="password" minlength="10" required autocomplete="new-password" placeholder="Mínimo de 10 caracteres"></div><div class="field"><label for="confirm">Confirmar senha</label><input class="control" id="confirm" type="password" minlength="10" required autocomplete="new-password"></div><button class="primary" type="submit">Criar meu acesso</button><div id="err" class="error"></div></form><div class="hint">Os registros ficam criptografados neste navegador. Nenhum dado é enviado ao site ou a um servidor.</div></section></div>`;
document.getElementById('setup').onsubmit=async e=>{e.preventDefault();let p=document.getElementById('pass').value;if(p!==document.getElementById('confirm').value){document.getElementById('err').textContent='As senhas não coincidem.';return}try{let salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(p,salt);records=[];localStorage.setItem(KEY,JSON.stringify({version:1,salt:b64(salt),...await seal(records)}));render()}catch{document.getElementById('err').textContent='Não foi possível ativar a criptografia neste navegador. Abra o arquivo em um navegador moderno.'}}}
function login(){app.innerHTML=`<div class="auth"><section class="authbox"><div class="mark">T</div><div class="eyebrow">Trindade Ruddy · privado</div><h1>Bem-vindo de volta</h1><p>Digite sua senha para abrir seus prospects.</p><form id="login"><div class="field"><label for="pass">Senha</label><input class="control" id="pass" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">Desbloquear</button><div id="err" class="error"></div></form><div class="hint">Seus dados estão criptografados neste navegador.</div></section></div>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{let box=JSON.parse(localStorage.getItem(KEY)),salt=un64(box.salt);key=await derive(document.getElementById('pass').value,salt);let clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(box.iv)},key,un64(box.cipher));records=JSON.parse(new TextDecoder().decode(clear));render()}catch{document.getElementById('err').textContent='Senha incorreta ou dados inválidos.'}}}
function field(label,name,val='',type='text',full=false,extra=''){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}</label>${type==='select'?`<select class="control" id="f-${name}" ${extra}>${['Novo','Contato feito','Proposta enviada','Cliente','Pausado'].map(x=>`<option ${val===x?'selected':''}>${x}</option>`).join('')}</select>`:type==='textarea'?`<textarea class="control" id="f-${name}" ${extra}>${esc(val)}</textarea>`:`<input class="control" id="f-${name}" type="${type}" value="${esc(val)}" ${extra}>`}</div>`}
function openForm(id){let item=records.find(x=>x.id===id)||{};let ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<section class="dialog"><h2>${id?'Editar prospect':'Novo prospect'}</h2><p>Registre as informações comerciais para acompanhar a oportunidade.</p><form id="recordForm"><div class="grid">${field('Nome empresarial','company',item.company||'','text',false,'required')}${field('Nicho / segmento','niche',item.niche||'')}${field('Pessoa de contato','contact',item.contact||'')}${field('E-mail','email',item.email||'','email')}${field('Telefone / WhatsApp','phone',item.phone||'','tel')}${field('Etapa','stage',item.stage||'Novo','select')}${field('Data em que geramos o contrato','contractDate',item.contractDate||'','date')}${field('Próximo contato','followup',item.followup||'','date')}${field('Observações','notes',item.notes||'','textarea',true)}</div><div class="dialog-actions"><button class="secondary" type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar prospect</button></div></form></section>`;document.body.append(ov);ov.querySelector('#cancel').onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.querySelector('form').onsubmit=async e=>{e.preventDefault();let v=n=>ov.querySelector('#f-'+n).value;let obj={...item,id:item.id||crypto.randomUUID(),company:v('company').trim(),niche:v('niche').trim(),contact:v('contact').trim(),email:v('email').trim(),phone:v('phone').trim(),stage:v('stage'),contractDate:v('contractDate'),followup:v('followup'),notes:v('notes').trim(),updatedAt:new Date().toISOString()};if(item.id)records=records.map(x=>x.id===id?obj:x);else records.unshift(obj);await persist();ov.remove();render();toast('Prospect salvo com segurança.')}}
function date(s){if(!s)return '—';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function render(){let shown=records.filter(r=>(filter==='Todos'||r.stage===filter)&&(!query||[r.company,r.niche,r.contact,r.email].join(' ').toLowerCase().includes(query.toLowerCase())));let follow=records.filter(r=>r.followup&&r.followup<=new Date().toISOString().slice(0,10)&&r.stage!=='Cliente').length;
app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="mark">T</div><span>TRINDADE RUDDY</span></div><div class="private"><span class="dot"></span>PAINEL PRIVADO</div></header><section class="hero"><div><div class="eyebrow">Relacionamento comercial</div><h1>Seus próximos bons clientes.</h1><p>Organize oportunidades, contratos e próximos contatos em um só lugar.</p></div><button class="primary" id="add">＋ Novo prospect</button></section><div class="stats"><div class="stat"><span>Prospects no caderno</span><strong>${records.length}</strong></div><div class="stat"><span>Propostas enviadas</span><strong>${records.filter(x=>x.stage==='Proposta enviada').length}</strong></div><div class="stat"><span>Contatos para acompanhar</span><strong>${follow}</strong></div></div><div class="toolbar"><input class="control search" id="search" placeholder="Buscar empresa, nicho ou contato…" value="${esc(query)}"><select class="control" id="filter"><option>Todos</option>${['Novo','Contato feito','Proposta enviada','Cliente','Pausado'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div><section class="panel">${shown.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Empresa</th><th>Etapa</th><th>Contrato gerado</th><th>Próximo contato</th><th></th></tr></thead><tbody>${shown.map(r=>`<tr><td><div class="company">${esc(r.company)}</div><div class="sub">${esc(r.niche||'Sem nicho informado')}${r.contact?' · '+esc(r.contact):''}</div></td><td><span class="badge b-${r.stage==='Contato feito'?'contato':r.stage==='Proposta enviada'?'proposta':r.stage==='Cliente'?'cliente':r.stage==='Pausado'?'pausado':'novo'}">${esc(r.stage)}</span></td><td>${date(r.contractDate)}</td><td>${date(r.followup)}</td><td><div class="actions"><button class="iconbtn edit" data-id="${r.id}" aria-label="Editar">Editar</button><button class="iconbtn del" data-id="${r.id}" aria-label="Excluir">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>${query||filter!=='Todos'?'Nenhum resultado encontrado':'Seu caderno começa aqui.'}</strong>${query||filter!=='Todos'?'Ajuste a busca ou o filtro para encontrar prospects.':'Adicione uma empresa para registrar nicho, contrato e acompanhamento.'}</div>`}</section><footer class="footer"><span>🔒 Dados criptografados neste dispositivo</span><div class="foot-actions"><button id="export" class="secondary">Exportar backup</button><button id="import" class="secondary">Importar backup</button><button id="lock" class="secondary">Bloquear</button></div></footer></div>`;
document.getElementById('add').onclick=()=>openForm();document.getElementById('search').oninput=e=>{query=e.target.value;render();let s=document.getElementById('search');s.focus();s.setSelectionRange(s.value.length,s.value.length)};document.getElementById('filter').onchange=e=>{filter=e.target.value;render()};document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openForm(b.dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{let r=records.find(x=>x.id===b.dataset.id);if(confirm(`Excluir o prospect “${r.company}”?`)){records=records.filter(x=>x.id!==r.id);await persist();render();toast('Prospect excluído.')}});document.getElementById('lock').onclick=()=>{key=null;records=[];query='';filter='Todos';login()};document.getElementById('export').onclick=()=>{let blob=new Blob([localStorage.getItem(KEY)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-prospects-trindade-ruddy.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('import').onclick=()=>fileInput.click();}
fileInput.onchange=async()=>{let f=fileInput.files[0];if(!f)return;try{let box=JSON.parse(await f.text()),salt=un64(box.salt),password=prompt('Digite a senha usada para criptografar este backup:');if(password===null)return;let k=await derive(password,salt),clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(box.iv)},k,un64(box.cipher)),imported=JSON.parse(new TextDecoder().decode(clear));if(!Array.isArray(imported))throw Error();key=k;records=imported;localStorage.setItem(KEY,JSON.stringify(box));render();toast('Backup importado.')}catch{alert('Não foi possível importar. Confira o arquivo e a senha.')}finally{fileInput.value=''}};
let stored=localStorage.getItem(KEY);if(!window.crypto?.subtle){app.innerHTML='<div class="auth"><section class="authbox"><h1>Navegador incompatível</h1><p>Este painel precisa de um navegador moderno com criptografia Web Crypto.</p></section></div>'}else if(stored)login();else setup();
})();
</script></body></html>
